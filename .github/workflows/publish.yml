name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing (provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm 11.x; trusted publishing needs npm >= 11.5.1.
          # (Node 22's npm 10.x swallowed the placeholder NODE_AUTH_TOKEN that
          # setup-node's registry-url injects instead of falling back to OIDC,
          # failing PUT with a misleading 404.) npm is pinned explicitly below
          # so the exact patch of the runner's Node 24 can't drift past it.
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - run: npm install -g npm@^11

      - run: npm ci --ignore-scripts

      - run: npm test

      # No NODE_AUTH_TOKEN: auth is delegated to npm trusted publishing via OIDC.
      - run: npm publish --access public --provenance
