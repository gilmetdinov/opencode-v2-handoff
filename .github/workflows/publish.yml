name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # OIDC for npm trusted publishing (provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24: ships npm >= 11.5.1, which is required for OIDC trusted
          # publishing. (Node 22 ships npm 10.x, which swallows the placeholder
          # NODE_AUTH_TOKEN injected by registry-url instead of using OIDC and
          # fails with a misleading 404 on PUT.)
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - run: npm ci --ignore-scripts

      - run: npm test

      # No NODE_AUTH_TOKEN: auth is delegated to npm trusted publishing via OIDC.
      - run: npm publish --access public --provenance
